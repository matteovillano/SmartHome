# Mosquitto config for Smart Home Brain. Run from this folder:
#   cd broker && mosquitto -c mosquitto.conf
# Relative paths below are resolved from the current directory.

# NFR6: every client must log in. passwd is created by ./setup-users.sh (git-ignored).
allow_anonymous false
password_file passwd
acl_file acl

# The board (M7) connects with plain MQTT over TCP.
listener 1883
protocol mqtt

# Browsers cannot open TCP sockets: the web app uses MQTT over WebSockets.
listener 9001
protocol websockets

# Keep retained messages (e.g. home/system/status) across broker restarts.
persistence true
persistence_location data/

log_type error
log_type warning
log_type notice
